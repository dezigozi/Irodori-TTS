[package]
name = "irodori-studio"
version = "0.1.0"
description = "いろとりスタジオ — 声のデータベース作成＋原稿読み上げ保存"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
lto = true
