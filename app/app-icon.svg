  <path d="M372 470 a140 140 0 0 0 280 0" stroke="#5fd37a" stroke-width="46" fill="none" stroke-linecap="round"/>
  <rect x="484" y="600" width="56" height="110" rx="20" fill="#3a3f4b"/>
